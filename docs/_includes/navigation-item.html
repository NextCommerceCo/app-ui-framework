<li class="nav-item">
    <a class="nav-link {% if page.url contains item.url %}active{% endif %}"
    {% if include.group %}
    role="button" data-bs-toggle="collapse" data-bs-target="#{{ item.group }}" aria-expanded="{% if page.url contains item.group %}true{% else %}false{% endif %}" aria-controls="{{ item.group }}"
    {% else %}
    href="{{ include.url | relative_url }}"
    {% endif %} >
        {{ include.title }}
    </a>
    {% if include.group %}
    <div class="{% if page.url contains item.group %}collapse show{% else %}collapse{% endif %}" id="{{ item.group }}">
        <ul class="nav flex-column">
            {% for subpage in collections.components %}
                    <li><a class="nav-link {% if subpage.url == page.url %}active{% endif %}" href="{{ subpage.url | relative_url }}" {% if subpage.url == page.url %}aria-current="true"{% endif %}>{{ subpage.data.title }}</a></li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}
</li>
